<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta und SEO</title>
<style>
  :root { --dim: #6b6f76; --line: #e8e8e8; --labelbg: #fafafa; --mono: ui-monospace, Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #2a2a2e; color: #16171a; padding: 24px 16px 60px; }
  h1 { font-size: 18px; color: #f2f2f4; font-weight: 600; }
  .lead { color: #a8a8ae; margin: 4px 0 12px; max-width: 1240px; }
  .switch { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .switch button { border: 0; background: #3a3a40; color: #f2f2f4; font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .switch button.on { background: #0a84ff; }
  .panel { max-width: 1240px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; background: #efefef; border-radius: 10px; overflow: hidden; margin-top: 8px; }
  @media (max-width: 900px) { .panel { grid-template-columns: 1fr; } }
  .main { padding: 16px 32px 40px; min-width: 0; }
  .side { background: #fff; border-left: 1px solid #e3e3e3; padding: 18px 22px; min-width: 0; }
  .top { display: flex; gap: 8px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  .top span { background: #fff; border-radius: 6px; padding: 4px 11px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .top span.on { background: #000; color: #fff; }
  .head { display: flex; align-items: center; gap: 14px; padding-bottom: 10px; border-bottom: 1px solid #ddd; margin-bottom: 18px; flex-wrap: wrap; }
  .head h2 { font-size: 26px; font-weight: 500; flex: 1; }
  .head .tab { font-size: 14px; color: #555; }
  .head .tab.on { color: #16171a; border-bottom: 2px solid #16171a; }
  .intro { color: var(--dim); margin: -6px 0 22px; }
  .sec { margin-bottom: 28px; }
  .sec h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .card { background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .row { display: grid; grid-template-columns: 170px 1fr; min-height: 40px; }
  .row + .row { border-top: 1px solid var(--line); }
  .lab { background: var(--labelbg); border-right: 1px solid var(--line); font: 12.5px var(--mono); color: var(--dim); padding: 0 12px; display: flex; align-items: center; }
  .val { display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-width: 0; flex-wrap: wrap; }
  .tg { display: inline-flex; gap: 2px; flex-wrap: wrap; }
  .tg span { font-size: 13px; padding: 1px 8px; border-radius: 4px; cursor: pointer; }
  .tg span.on { background: #000; color: #fff; }
  .val input.t { border: 0; outline: none; font: 14px var(--mono); width: 100%; background: transparent; }
  .help { font-size: 12.5px; line-height: 1.5; color: var(--dim); padding: 6px 0 0; }
  .drop { border: 1px dashed #c8c8c8; border-radius: 4px; padding: 10px 12px; color: var(--dim); font-size: 13px; width: 100%; display: flex; align-items: center; gap: 10px; }
  .thumb { width: 72px; height: 38px; border-radius: 3px; background: linear-gradient(135deg, #e30613, #7a1f2b); flex: none; }
  /* kirby fields */
  .kf { margin-bottom: 18px; }
  .kf label { display: flex; justify-content: space-between; font-weight: 500; font-size: 13px; margin-bottom: 6px; }
  .kf label small { font-weight: 400; color: var(--dim); font-family: var(--mono); }
  .kf label small.over { color: #d1242f; }
  .kf input, .kf textarea { width: 100%; border: 0; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); padding: 8px 10px; font: inherit; background: #fff; outline: none; }
  .kf textarea { min-height: 70px; resize: vertical; }
  .kf input::placeholder, .kf textarea::placeholder { color: #a3a6ab; }
  .kf .help { padding-top: 5px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .ktog { display: inline-flex; background: #fff; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08); padding: 2px; }
  .ktog span { padding: 4px 12px; font-size: 13px; border-radius: 3px; cursor: pointer; }
  .ktog span.on { background: #16171a; color: #fff; }
  .new { outline: 2px dashed #ff9f0a; outline-offset: 6px; border-radius: 4px; }
  .gone { opacity: .45; text-decoration: line-through; }
  hr { border: 0; border-top: 1px solid #ddd; margin: 6px 0 20px; }
  /* previews */
  .side h4 { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 0 0 8px; }
  .side .g + .g { margin-top: 22px; }
  .serp { font-family: Arial, sans-serif; }
  .serp .site { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #202124; }
  .serp .fav { width: 26px; height: 26px; border-radius: 50%; background: #f1f3f4; display: grid; place-items: center; color: #e30613; font-weight: 700; font-size: 13px; }
  .serp .site small { display: block; color: #4d5156; }
  .serp .t { color: #1a0dab; font-size: 19px; line-height: 1.3; margin: 6px 0 3px; }
  .serp .d { color: #4d5156; font-size: 13.5px; line-height: 1.55; }
  .share { border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; font-family: -apple-system, sans-serif; }
  .share .img { aspect-ratio: 1.91 / 1; background: linear-gradient(135deg, #e30613, #7a1f2b); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; }
  .share .b { padding: 10px 12px; background: #f6f7f9; }
  .share .b small { color: #65676b; font-size: 11.5px; text-transform: uppercase; }
  .share .b div { font-weight: 600; font-size: 14.5px; margin: 2px 0; }
  .share .b p { color: #65676b; font-size: 12.5px; }
  .code { font: 11.5px/1.6 var(--mono); color: #444; background: #f6f7f9; border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-all; }
  .notes { max-width: 1240px; color: #ff9f0a; font-size: 12.5px; margin-top: 12px; }
  .notes p + p { margin-top: 6px; }
</style>
</head>
<body>
<h1>Meta-Daten – Titel, Beschreibung, Teilen</h1>
<p class="lead">Zwei Stellen: der Project Wizard (gilt für die ganze Website) und der Reiter „Eigenschaften“ einer Seite. Alles ist bedienbar, rechts die Vorschau in Google, beim Teilen und im HTML. Erläuterungen in Orange gehören nicht zum Plugin.</p>
<div class="switch" id="view"></div>
<div class="panel"><div class="main" id="main"></div><div class="side" id="side"></div></div>
<div class="notes" id="notes"></div>
<script>
  const S = { view: 'wizard', order: 'page', sep: '–', site: 'ENCOM Lab', home: 'site', descFallback: 'text', page: 'ki', seoTitle: '', desc: '', index: true };
  const PAGES = { ki: { t: 'KI-Agenten', url: 'encom-lab.de › de › ki-agenten', text: 'Unsere E-Buddies: Monstergute KI-Agenten für Ihr Unternehmen. Sie beseitigen Zeitfresser, entlasten Ihr Team und schaffen endlich wieder Zeit fürs Wesentliche.' },
                  home: { t: 'Home', url: 'encom-lab.de › de', text: 'ENCOM Lab entwickelt KI-Agenten, Software und Beratung für den Mittelstand – praxisnah, sicher und messbar.' } };
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  function title() {
    const p = PAGES[S.page];
    if (S.seoTitle.trim()) return S.seoTitle.trim();
    if (S.page === 'home' && S.home === 'site') return S.site;
    if (S.order === 'none') return p.t;
    return S.order === 'page' ? p.t + ' ' + S.sep + ' ' + S.site : S.site + ' ' + S.sep + ' ' + p.t;
  }
  function desc() {
    if (S.desc.trim()) return S.desc.trim();
    if (S.descFallback === 'none') return '';
    const t = PAGES[S.page].text; return t.length > 155 ? t.slice(0, 155).replace(/\s+\S*$/, '') + ' …' : t;
  }
  const tg = (key, opts) => '<span class="tg">' + opts.map(([v, t]) => '<span data-k="' + key + '" data-v="' + v + '" class="' + (S[key] === v ? 'on' : '') + '">' + t + '</span>').join('') + '</span>';
  function wizard() {
    return '<div class="top"><span class="on">Projekt ▾</span><span>Elemente ▾</span><span>Blöcke ▾</span><span>Einstellungen ▾</span></div>' +
      '<div class="head"><h2>Suchmaschinen</h2></div>' +
      '<p class="intro">Wie Seiten in Google und beim Teilen (WhatsApp, LinkedIn …) erscheinen. Jede Seite kann unter „Eigenschaften“ davon abweichen.</p>' +
      '<div class="sec new"><h3>Seitentitel</h3><div class="card">' +
        '<div class="row"><div class="lab">Websitename</div><div class="val"><input class="t" data-f="site" value="' + esc(S.site) + '"></div></div>' +
        '<div class="row"><div class="lab">Aufbau</div><div class="val">' + tg('order', [['page', 'Seite ' + S.sep + ' Website'], ['site', 'Website ' + S.sep + ' Seite'], ['none', 'Nur Seite']]) + '</div></div>' +
        '<div class="row"><div class="lab">Trennzeichen</div><div class="val">' + tg('sep', [['–', '–'], ['|', '|'], ['·', '·'], ['/', '/']]) + '</div></div>' +
        '<div class="row"><div class="lab">Startseite</div><div class="val">' + tg('home', [['site', 'Nur Websitename'], ['same', 'Wie alle Seiten']]) + '</div></div>' +
      '</div><p class="help">Der Titel im Browser-Tab und in Google. Ohne Angabe heißt die Website wie im Panel unter „Website“.</p></div>' +
      '<div class="sec new"><h3>Beschreibung</h3><div class="card">' +
        '<div class="row"><div class="lab">Ohne eigene</div><div class="val">' + tg('descFallback', [['text', 'Anfang des ersten Textes'], ['none', 'Keine']]) + '</div></div>' +
      '</div><p class="help">Was Google unter dem Titel zeigt, wenn eine Seite keine eigene Beschreibung hat. Google kürzt nach etwa 155 Zeichen.</p></div>' +
      '<div class="sec new"><h3>Teilen</h3><div class="card">' +
        '<div class="row"><div class="lab">Standardbild</div><div class="val"><div class="drop"><span class="thumb"></span>teilen-encom.jpg · 1200 × 630<span style="margin-left:auto;text-decoration:underline">Ersetzen …</span></div></div></div>' +
      '</div><p class="help">Erscheint, wenn jemand eine Seite in WhatsApp, LinkedIn oder Slack teilt – außer die Seite hat ein eigenes Bild. Am besten 1200 × 630 Pixel.</p></div>';
  }
  function page() {
    const p = PAGES[S.page];
    const n = S.seoTitle.length, d = S.desc.length;
    return '<div class="top"><span>ENCOM Lab</span><span>/</span><span>' + p.t + '</span></div>' +
      '<div class="head"><h2>' + p.t + '</h2><span class="tab">Struktur</span><span class="tab">Inhalt</span><span class="tab on">Eigenschaften</span></div>' +
      '<div class="new" style="padding:2px 0 4px"><div class="kf" style="margin-bottom:10px"><h3 style="font-size:14px">Google und Teilen</h3><p class="help" style="padding:2px 0 0">Wie diese Seite in Google und beim Teilen erscheint. Leer lassen: automatisch.</p></div>' +
      '<div class="kf"><label>SEO-Titel <small class="' + (n > 60 ? 'over' : '') + '">' + n + '/60</small></label><input data-f="seoTitle" value="' + esc(S.seoTitle) + '" placeholder="' + esc(title()) + '"><p class="help">Ersetzt den ganzen Titel, auch den Websitenamen.</p></div>' +
      '<div class="kf"><label>Beschreibung <small class="' + (d > 155 ? 'over' : '') + '">' + d + '/155</small></label><textarea data-f="desc" placeholder="' + esc(desc() || '') + '">' + esc(S.desc) + '</textarea></div>' +
      '<div class="cols"><div class="kf"><label>Bild zum Teilen</label><div class="drop" style="background:#fff">Standardbild aus dem Project Wizard · Auswählen …</div></div>' +
      '<div class="kf"><label>In Suchmaschinen</label><span class="ktog">' + [['1', 'Anzeigen'], ['0', 'Nicht anzeigen']].map(([v, t]) => '<span data-k="index" data-v="' + v + '" class="' + ((S.index ? '1' : '0') === v ? 'on' : '') + '">' + t + '</span>').join('') + '</span><p class="help">„Nicht anzeigen“: z. B. für Danke-Seiten.</p></div></div></div>' +
      '<hr><div class="kf"><h3 style="font-size:14px">Seite</h3></div>' +
      '<div class="cols"><div class="kf"><label>Abweichender Navigationstitel</label><input placeholder="Titel …"></div><div class="kf"><label>Teaser</label><textarea style="min-height:40px"></textarea></div></div>' +
      '<div class="kf gone"><label>Meta-Keywords · Autor · Robots · Canonical</label></div>';
  }
  function side() {
    const t = title(), d = desc(), p = PAGES[S.page];
    const html = '<title>' + t + '</title>\n' + (d ? '<meta name="description" content="' + d.slice(0, 40) + '…">\n' : '') + (S.index ? '' : '<meta name="robots" content="noindex">\n') +
      '<link rel="canonical" href="https://encom-lab.de/de/' + (S.page === 'ki' ? 'ki-agenten' : '') + '">\n<link rel="alternate" hreflang="en" href="…/en/…">\n<meta property="og:title" content="' + t + '">\n<meta property="og:image" content="…/teilen-encom.jpg">';
    return '<div class="switch" style="margin:0 0 14px">' + [['ki', 'KI-Agenten'], ['home', 'Startseite']].map(([k, l]) => '<button data-page="' + k + '" style="background:' + (S.page === k ? '#16171a' : '#eee') + ';color:' + (S.page === k ? '#fff' : '#16171a') + '">' + l + '</button>').join('') + '</div>' +
      '<div class="g"><h4>Google</h4>' + (S.index ? '<div class="serp"><div class="site"><span class="fav">e</span><span>' + esc(S.site) + '<small>' + p.url + '</small></span></div><div class="t">' + esc(t.length > 62 ? t.slice(0, 60) + ' …' : t) + '</div><div class="d">' + esc(d || '(Google wählt selbst einen Ausschnitt der Seite)') + '</div></div>' : '<p class="help">Diese Seite erscheint nicht in Google.</p>') + '</div>' +
      '<div class="g"><h4>Teilen (LinkedIn, WhatsApp)</h4><div class="share"><div class="img">ENCOM Lab</div><div class="b"><small>encom-lab.de</small><div>' + esc(t) + '</div><p>' + esc((d || '').slice(0, 90)) + (d.length > 90 ? ' …' : '') + '</p></div></div></div>' +
      '<div class="g"><h4>Im HTML</h4><div class="code">' + esc(html) + '</div></div>';
  }
  const notes = '<p><b>Heute</b> gibt die Website nur <code>&lt;title&gt;Seitentitel&lt;/title&gt;</code> aus. Die Felder unter „Eigenschaften“ gibt es schon, sie werden aber nicht verwendet.</p>' +
    '<p><b>Wichtig:</b> Das alte Feld „Robots“ steht auf fast allen Seiten auf „noindex, nofollow“ (encom: 60 von 62 Seiten) – nur weil das sein Startwert war. Es wird deshalb <b>nicht</b> übernommen, sonst verschwänden die Seiten aus Google. Neu ist der Schalter „In Suchmaschinen“, Start: Anzeigen. Ebenso entfallen Keywords (Google ignoriert sie), Autor und das Canonical-Feld (Canonical setzt der Pagewizard selbst). Schon eingetragene Seitentitel und Beschreibungen bleiben erhalten.</p>' +
    '<p><b>Automatisch, ohne Einstellung:</b> Canonical auf die eigene Adresse, hreflang für alle Sprachen, Open Graph (Titel, Beschreibung, Bild, Sprache), Twitter-Card. Auf Staging zusätzlich immer „noindex“, damit Google die Testseite nicht findet.</p>';
  const vb = document.getElementById('view');
  [['wizard', 'Project Wizard › Projekt › Suchmaschinen'], ['page', 'Seite › Eigenschaften']].forEach(([k, t]) => { const b = document.createElement('button'); b.textContent = t; b.dataset.k = k; b.onclick = () => { S.view = k; render(); }; vb.appendChild(b); });
  document.addEventListener('click', (e) => {
    const d = e.target.dataset;
    if (d.k && d.v !== undefined) { S[d.k] = d.k === 'index' ? d.v === '1' : d.v; render(); }
    if (d.page) { S.page = d.page; render(); }
  });
  document.addEventListener('input', (e) => { const f = e.target.dataset.f; if (!f) return; S[f] = e.target.value; document.getElementById('side').innerHTML = side(); if (S.view === 'page') { const pos = e.target.selectionStart; render(); const el = document.querySelector('[data-f="' + f + '"]'); el.focus(); el.setSelectionRange(pos, pos); } });
  function render() {
    [...vb.children].forEach((b) => b.classList.toggle('on', b.dataset.k === S.view));
    document.getElementById('main').innerHTML = S.view === 'wizard' ? wizard() : page();
    document.getElementById('side').innerHTML = side();
    document.getElementById('notes').innerHTML = notes;
  }
  render();
</script>
</body>
</html>
