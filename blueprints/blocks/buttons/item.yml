---
name: pw.field.button
icon: url
tabs:
  link:
    label: pw.tab.link
    fields:
      headlineLink:
        extends: pagewizard/headlines/link
      linkType:
        extends: pagewizard/fields/link-type
      linkInternal:
        extends: pagewizard/fields/link-internal
        when:
          linkType: false
      linkExternal:
        extends: pagewizard/fields/link-external
        when:
          linkType: true
      linkTarget:
        extends: pagewizard/fields/link-target
        when:
          linkType: true
      linkRel:
        extends: pagewizard/fields/link-rel
        when:
          linkType: true
          linkTarget: true
      linkText:
        extends: pagewizard/fields/link-text
        width: 3/4
      iconPosition:
        label: pw.field.button.icon
        help: pw.field.button.icon.help
        type: toggles
        labels: false
        options:
          - value: left
            icon: text-left
          - value: right
            icon: text-right
        width: 1/4
      iconLeft:
        label: pw.field.button.icon.search
        type: pwicon
        when:
          iconPosition: left
      iconRight:
        label: pw.field.button.icon.search
        type: pwicon
        when:
          iconPosition: right
      ariaLabel:
        extends: pagewizard/fields/link-aria-label
      ariaDescribedby:
        extends: pagewizard/fields/link-aria-describedby